# database-deployment.yaml
# PostgreSQL deployment for the Production System Monitoring Platform

apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  labels:
    app: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: database
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: monitoring_platform
            - name: POSTGRES_USER
              value: monitor_user
            - name: POSTGRES_PASSWORD
              value: monitor_pass
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: database-pvc